services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: telemed
      POSTGRES_USER: telemed
      POSTGRES_PASSWORD: telemed
    ports:
      - "5433:5433"
    volumes:
      - telemed-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telemed -d telemed"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  telemed-postgres-data:
